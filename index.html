<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Registration | Reading Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Alegreya:wght@700;800&display=swap">
  <link rel="stylesheet" href="library.css">
</head>
<body class="split-layout">
  <aside class="photo-panel">
    <a class="logo" href="index.html">Reading Room</a>
    <div>
      <p class="panel-quote">Your college library card, online.</p>
      <p class="panel-owner">Pratham Singh, PRN 1032211384</p>
    </div>
  </aside>

  <main class="form-panel">
    <div class="tabs">
      <a href="index.html" aria-current="page">Register</a>
      <a href="catalogue.html">Catalogue</a>
    </div>

    <h1>Student registration</h1>
    <p id="welcome-message" role="status"></p>

    <form id="registration-form" novalidate>
      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username">
        <p class="error" id="username-error"></p>
      </div>

      <div class="input-group">
        <label for="email">Email</label>
        <input type="text" id="email" autocomplete="email">
        <p class="hint">Use the format name@abc.com, with exactly 3 letters after the @.</p>
        <p class="error" id="email-error"></p>
      </div>

      <div class="input-group">
        <label for="phone">Phone number</label>
        <input type="text" id="phone" inputmode="numeric" autocomplete="tel">
        <p class="error" id="phone-error"></p>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="new-password">
        <p class="hint">At least 7 characters, with a capital letter, a digit and one of &amp; , $ # @</p>
        <p class="error" id="password-error"></p>
      </div>

      <div class="input-group">
        <label for="confirm-password">Confirm password</label>
        <input type="password" id="confirm-password" autocomplete="new-password">
        <p class="error" id="confirm-password-error"></p>
      </div>

      <button type="submit" class="action primary">Register</button>
      <p id="success-message" role="status"></p>
    </form>
  </main>

  <script src="validation.js"></script>
</body>
</html>
